<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Position Glance — Perspective shift</title>
<style>html,body{margin:0;background:#0B0E0C;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* Effect 13 — Perspective shift. One clock, deterministic, 8s seamless loop.
   Brand: brand.md / MOTION.md. Content: wordmark only, no invented figures. */
const W = 1920, H = 1080, ctx = document.getElementById('c').getContext('2d');
const C = { ground:'#0B0E0C', surface:'#121812', green:'#8DFF9B', dim:'#3D7F4B', ink:'#E5E5E5', amber:'#FFB27A' };
const FONT = 'Menlo, SFMono-Regular, monospace';
const LAYERS = [
  { label:'POSITION', color:C.dim,  tx:0.30, ty:0.40, scale:0.82, beat:0.00 },
  { label:'GLANCE',   color:C.green, tx:0.52, ty:0.50, scale:1.00, beat:0.28 },
  { label:'ONE NUMBER · ONE SENTENCE · ONE TAP', color:C.ink, tx:0.74, ty:0.61, scale:0.70, beat:0.56 },
];
const ease = (x) => x <= 0 ? 0 : x >= 1 ? 1 : (x < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x+2,3)/2);
const clamp01 = (x) => Math.max(0, Math.min(1, x));

function progress(t, beat) {
  if (t < 2.2) return ease(clamp01((t - beat) / (2.2 - beat)));
  if (t < 6.6) return 1;
  return 1 - ease(clamp01((t - 6.6) / 1.4));
}

function quad(layer, p, vp) {
  const cx0 = W*0.5, cy0 = H*0.5;
  const cx = cx0 + (W*layer.tx - cx0) * p;
  const cy = cy0 + (H*layer.ty - cy0) * p;
  const sc = 1 + (layer.scale - 1) * p;
  const w = 980 * sc, h = 360 * sc;
  const corners = [
    [cx-w/2, cy-h/2], [cx+w/2, cy-h/2], [cx+w/2, cy+h/2], [cx-w/2, cy+h/2],
  ];
  // All layers share one vanishing point: right corners are pulled further.
  return corners.map(([x,y], i) => {
    const pull = p * (i === 1 || i === 2 ? 0.34 : 0.10);
    return [x + (vp.x-x)*pull, y + (vp.y-y)*pull];
  });
}
function path(q) {
  ctx.beginPath(); ctx.moveTo(q[0][0],q[0][1]);
  for (let i=1;i<q.length;i++) ctx.lineTo(q[i][0],q[i][1]);
  ctx.closePath();
}
function center(q){ return [q.reduce((s,p)=>s+p[0],0)/4, q.reduce((s,p)=>s+p[1],0)/4]; }
function widthOf(q){ return Math.hypot(q[1][0]-q[0][0], q[1][1]-q[0][1]); }

function draw(t) {
  // One full sine period over 8s so seek(0) and seek(8) are identical.
  const vp = { x: W*0.86, y: H*0.44 + Math.sin(t*Math.PI/4)*18 };
  ctx.fillStyle = C.ground; ctx.fillRect(0,0,W,H);

  // Ghost of the flat start state.
  ctx.save();
  const ghost = t < 2.2 ? 1 - t/2.2 : (t > 6.6 ? (t-6.6)/1.4 : 0);
  ctx.globalAlpha = 0.18 * ghost;
  ctx.strokeStyle = C.dim; ctx.lineWidth = 2;
  LAYERS.forEach((l,i) => {
    const q = quad(l, 0, vp);
    ctx.strokeRect(q[0][0]-i*6, q[0][1]-i*6, widthOf(q)+i*12, 360+i*12);
  });
  ctx.restore();

  // Perspective guides to the shared vanishing point.
  if (t > 0.9) {
    const a = Math.min(0.45, (t-0.9)*0.5) * (t > 6.6 ? Math.max(0,(8-t)/1.4) : 1);
    ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = C.dim; ctx.lineWidth = 1.5;
    ctx.setLineDash([10,14]);
    LAYERS.forEach(l => {
      const q = quad(l, progress(t,l.beat), vp);
      [q[1], q[2]].forEach(c => { ctx.beginPath(); ctx.moveTo(c[0],c[1]); ctx.lineTo(vp.x,vp.y); ctx.stroke(); });
    });
    ctx.setLineDash([]);
    ctx.fillStyle = C.amber; ctx.beginPath(); ctx.arc(vp.x,vp.y,6,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  LAYERS.forEach((l, i) => {
    const p = progress(t, l.beat);
    const q = quad(l, p, vp);
    const [cx,cy] = center(q);
    const wd = widthOf(q);
    ctx.save();
    path(q);
    ctx.fillStyle = i === 0 ? C.surface : (i === 1 ? '#0F1710' : C.surface);
    ctx.fill();
    ctx.strokeStyle = i === 1 ? C.green : C.dim;
    ctx.lineWidth = i === 1 ? 3 : 2;
    ctx.stroke();
    ctx.textAlign = 'center';
    const fs = Math.min(wd/(l.label.length*0.63), i===2?34:118);
    ctx.font = `bold ${fs}px ${FONT}`;
    ctx.fillStyle = l.color;
    ctx.fillText(l.label, cx, cy + fs*0.35);
    ctx.restore();
  });

  ctx.save();
  ctx.fillStyle = C.amber; ctx.font = `20px ${FONT}`; ctx.textAlign='left';
  ctx.fillText('POSITION GLANCE  /  PERSPECTIVE SHIFT', 56, 56);
  ctx.fillStyle = C.dim; ctx.font = `16px ${FONT}`;
  ctx.fillText('ONE NUMBER · ONE SENTENCE · ONE TAP', 56, 86);
  ctx.restore();
}

window.seek = (t) => { draw(Math.max(0, Math.min(8, Number(t)||0))); return t; };
const params = new URLSearchParams(location.search);
if (params.has('render')) window.seek(params.get('t') || 0);
else { const s=performance.now(); (function loop(n){ draw(((n-s)/1000)%8); requestAnimationFrame(loop); })(s); }
</script>
</body>
</html>
